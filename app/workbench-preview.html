<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ketor Workbench Preview</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <link rel="stylesheet" href="./assets/css/vscode-theme.css" />
  <link rel="stylesheet" href="./assets/css/vscode-components.css" />
  <link rel="stylesheet" href="./assets/css/workbench-base.css" />
  <link rel="stylesheet" href="./assets/css/workbench-mobile.css" />
</head>
<body>
  <script>
    (function () {
      function showError(title, detail) {
        var box = document.getElementById('kt-error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'kt-error-box';
          box.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#5a1d1d;color:#f48771;padding:12px;font:12px monospace;z-index:99999;max-height:60vh;overflow:auto;white-space:pre-wrap;border-bottom:2px solid #ff4444;';
          document.body.appendChild(box);
        }
        box.textContent += '[' + title + '] ' + detail + '\n\n';
      }
      window.addEventListener('error', function (ev) {
        showError('Error ' + (ev.filename || '?') + ':' + ev.lineno + ':' + ev.colno,
          ev.message + '\n' + (ev.error && ev.error.stack ? ev.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        showError('Rejection', (r && r.stack) ? r.stack : String(r));
      });
      window.__ktShowError = showError;
    })();
  </script>

  <div id="root"></div>
  <input id="kt-input-rom" type="file" style="display:none" />
  <input id="kt-input-table" type="file" style="display:none" accept=".tbl,.txt" />
  <input id="kt-input-table-compare" type="file" style="display:none" accept=".tbl,.txt" />
  <input id="kt-input-csv" type="file" style="display:none" accept=".csv" />

  <script src="./assets/js/core/relative-search.js"></script>
  <script src="./assets/js/core/table-generator.js"></script>
  <script src="./assets/js/core/font-detect.js"></script>
  <script src="./assets/js/core/translator.js"></script>
  <script src="./assets/js/core/rom-loader.js"></script>
  <script src="./assets/js/core/monkey-moore.js"></script>

  <script src="./assets/js/core.js"></script>
  <script>
    window.Ketor = window.Ketor || {};
    window.Ketor.legacy = {
      createTextExtractorWorker: createTextExtractorWorker,
      createRelativeSearchWorker: createRelativeSearchWorker,
      createTableWorker: createTableWorker,
      createBuildWorker: createBuildWorker,
      createTranslationInputWorker: createTranslationInputWorker,
      smartTextParse: smartTextParse,
      getSmartByteLength: getSmartByteLength,
      createTokenizer: createTokenizer,
      rebuildRom: rebuildRom,
      applyPatch: applyPatch,
      exportCSV: exportCSV,
      parseCSV: parseCSV,
      aiTranslateText: aiTranslateText,
      detectSystem: detectSystem
    };
  </script>

  <script src="./assets/js/workflows/pce.js"></script>

  <script src="./assets/js/workflows/3ds.js"></script>

  <script>
    (function () {
      try {
        var R = window.React, RD = window.ReactDOM;
        if (!R || !RD) { window.__ktShowError('Bootstrap', 'React failed.'); return; }
        if (!window.Ketor || !window.Ketor.ui || !window.Ketor.ui.KetorWorkbench) {
          window.__ktShowError('Bootstrap', 'Workbench failed to load.');
          return;
        }
        var root = RD.createRoot(document.getElementById('root'));
        root.render(R.createElement(window.Ketor.ui.KetorWorkbench, null));
      } catch (err) {
        window.__ktShowError('Bootstrap Exception',
          (err && err.stack) ? err.stack : String(err));
      }
    })();
  </script>
